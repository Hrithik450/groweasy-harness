<svg viewBox="-15 -15 259 259" xmlns="http://www.w3.org/2000/svg" style="--fg:#FFFFFF;--bg:#0A0A0C;overflow:visible;">
  
    <style>
      .grok-bot-head { fill: var(--fg, #FFFFFF); }
      .grok-bot-eye {
        fill: var(--bg, #0A0A0C);
        transform-origin: 114px 114px;
        animation: eyeBlink 4.5s ease-in-out infinite, eyeShift 9s ease-in-out infinite;
      }
      .grok-bot-eye-right {
        animation-delay: 0s, 0.05s;
      }
      @keyframes eyeBlink {
        0%, 94%, 98%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.08); }
      }
      @keyframes eyeShift {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-3px, 1px); }
        50% { transform: translate(0, -2px); }
        75% { transform: translate(3px, 1px); }
      }
    </style>
  
