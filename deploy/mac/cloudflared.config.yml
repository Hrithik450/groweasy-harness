# Rendered by install.sh from CLOUDFLARED_* values in the deploy .env.
# No tunnel id, token or credential path is committed to the repo.
tunnel: __TUNNEL_ID__
credentials-file: __TUNNEL_CREDENTIALS_FILE__

ingress:
  - hostname: __TUNNEL_HOSTNAME__
    service: http://localhost:__CADDY_PORT__
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true
  - service: http_status:404
